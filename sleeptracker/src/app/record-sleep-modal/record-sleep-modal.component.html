<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="header-stack">
      <ion-buttons slot="start">
        <ion-button class="cancel-btn" (click)="cancel()">Cancel</ion-button>
      </ion-buttons>
      <h1 class="modal-title">{{ editing ? 'Edit Sleep' : 'Record Sleep' }}</h1>
      @if (lastRecorded) {
        <p class="last-recorded">Last Recorded: {{ lastRecorded | date: 'MMMM d, y' }}</p>
      }
    </div>
    
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="cat-area">
    <img src="assets/sleepiness_scale/Asleep.svg" alt="Sleeping cat" />
  </div>

  <div class="row">
    <span class="row-label">Start</span>
    <ion-datetime-button datetime="start-dt"></ion-datetime-button>
  </div>
  <div class="row">
    <span class="row-label">End</span>
    <ion-datetime-button datetime="end-dt"></ion-datetime-button>
  </div>

  <div class="save-wrap">
    <ion-button class="save-btn" shape="round" (click)="save()">Save</ion-button>
  </div>

  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime
        id="start-dt"
        [value]="start"
        [formatOptions]="formatOptions"
        (ionChange)="start = $any($event.detail.value)"
      ></ion-datetime>
    </ng-template>
  </ion-modal>
  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime
        id="end-dt"
        [value]="end"
        [formatOptions]="formatOptions"
        (ionChange)="end = $any($event.detail.value)"
      ></ion-datetime>
    </ng-template>
  </ion-modal>
</ion-content>
