<ion-header>
  <ion-toolbar>
    <ion-title class="page-title">Sleepiness</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <h2 class="section-label">Recent Logs</h2>
  <ion-list lines="full" class="log-list">
    @for (log of logs; track log.id) {
      <ion-item-sliding #slider>
        <ion-item [button]="true" [detail]="false" (click)="openEditModal(log, slider)">
          <ion-thumbnail slot="start">
            <img class="cat-img" [src]="catFor(log)" [alt]="'Sleepiness level ' + log.loggedValue" />
          </ion-thumbnail>
          <ion-label>
            <h3>{{ log.loggedAt | date: 'MMMM d, y' }}</h3>
            <p>{{ log.loggedAt | date: 'h:mm a' }}</p>
          </ion-label>
          <ion-note slot="end" class="level">{{ log.loggedValue }}</ion-note>
        </ion-item>

        <ion-item-options side="end">
          <ion-item-option class="edit-option" (click)="openEditModal(log, slider)">
            <ion-icon slot="icon-only" name="create-outline"></ion-icon>
          </ion-item-option>
          <ion-item-option class="delete-option" (click)="confirmDelete(log, slider)">
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    }
  </ion-list>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="openRecordModal()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
